<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #13294B;
    --cream: #F4F2EC;
    --ink: #1B2230;
    --slate: #4A5468;
    --line: #DDD8CC;
    --green: #7CC25A;
    --line-green: #06C755;
  }
  html { background: var(--cream); }
  body {
    font-family: "Noto Sans TC", "PingFang TC", -apple-system, system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    max-width: 480px; margin: 0 auto; min-height: 100vh;
    background: var(--cream);
  }
  a { color: inherit; text-decoration: none; }

  .top {
    background: var(--navy); color: #FFFFFF; text-align: center;
    padding: calc(28px + env(safe-area-inset-top)) 24px 30px;
    position: relative;
  }
  .top::after { /* 名片底部的綠藍色條 */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
    background: linear-gradient(90deg, #3B8A33 0 50%, #0B8FCB 50% 100%);
  }
  .mark { width: 92px; height: 53px; display: block; margin: 0 auto; }
  .photo {
    width: 104px; height: 104px; border-radius: 50%; display: block; margin: 20px auto 0;
    object-fit: cover; border: 3px solid rgba(255,255,255,0.9);
  }
  .name { margin-top: 14px; font-size: 32px; font-weight: 900; letter-spacing: 0.1em; padding-left: 0.1em; }
  .en { margin-top: 4px; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.34em; padding-left: 0.34em; color: #C9D3E3; }
  .pos { margin-top: 14px; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; }
  .pos span { color: var(--green); margin: 0 6px; }

  .btns { padding: 22px 20px 6px; display: flex; flex-direction: column; gap: 12px; }
  .btn {
    height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 16.5px; font-weight: 700; letter-spacing: 0.04em;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn.line { background: var(--line-green); color: #FFFFFF; }
  .btn.save { background: var(--navy); color: #FFFFFF; }
  .btn.web { background: #FFFFFF; color: var(--navy); border: 1.5px solid var(--line); }

  .sec { padding: 18px 24px 0; }
  .label { font-family: Montserrat, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.22em; color: #8A93A3; margin-bottom: 10px; }
  .roles { display: flex; flex-direction: column; gap: 12px; }
  .role b { display: block; font-size: 15px; font-weight: 700; color: var(--navy); }
  .role span { font-size: 13.5px; color: var(--slate); }
  .contacts { background: #FFFFFF; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .contacts a { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
  .contacts a + a { border-top: 1px solid var(--line); }
  .contacts .k { font-family: Montserrat, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: #8A93A3; }
  .contacts .v { font-family: Montserrat, "Noto Sans TC", sans-serif; font-size: 15px; font-weight: 600; color: var(--ink); }
  .brands { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 26px 24px 0; }
  .brands img { display: block; height: 26px; width: auto; filter: brightness(0); opacity: 0.6; }
  .brands img.fitbiz { height: 18px; }
  .brands img.noset { height: 12px; }
  footer { padding: 26px 24px calc(30px + env(safe-area-inset-bottom)); text-align: center; font-size: 12px; color: #8A93A3; }
</style>
</head>
