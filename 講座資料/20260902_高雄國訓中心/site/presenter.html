<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 教練工作術｜講師控制台</title><link rel="stylesheet" href="site.css"><body><main class="presenter"><aside class="pane left"><span class="kicker">SLIDES</span><div id="nav"></div></aside><section class="pane"><span class="kicker">PRESENTER MODE</span><div id="preview" class="preview"></div><div class="btn-row"><button class="btn ghost" onclick="move(-1)">← 上一頁</button><button class="btn" onclick="move(1)">下一頁 →</button><button class="btn ghost" onclick="window.open('slides.html?slide='+current,'_blank')">另開投影片</button></div><div class="timer"><span class="small">現在時間／全場結束 12:45</span><strong id="clock">--:--</strong><span id="pace" class="small">尚未啟動計時</span></div><div class="timer"><span class="small" id="phase">第一堂 · 45 分鐘</span><strong id="count">45:00</strong><div class="btn-row"><button class="btn" onclick="toggleTimer()">開始／暫停</button><button class="btn ghost" onclick="resetTimer()">重設</button><button class="btn ghost" onclick="nextPhase()">下一段</button></div></div></section><aside class="pane"><span class="kicker">SPEAKER NOTES</span><h2 id="title"></h2><p id="notes" class="sub" style="font-size:1rem"></p><div class="timer"><span class="small">本頁建議時間</span><strong id="duration"></strong></div><div id="demo"></div><div class="btn-row"><button class="btn ghost" onclick="openTool('Claude')">開啟 Claude</button><button class="btn ghost" onclick="openTool('ChatGPT')">ChatGPT</button><button class="btn ghost" onclick="openTool('Gemini')">Gemini</button><a class="btn ghost" href="resources.html" target="_blank">學員資源</a></div></aside></main><script src="course-data.js"></script><script src="site.js"></script><script>
let current=Number(localStorage.getItem('nstc.slide'))||1,channel;try{channel=new BroadcastChannel('nstc-slide');channel.onmessage=e=>{current=Number(e.data);render()}}catch(e){};
function sync(){localStorage.setItem('nstc.slide',current);try{channel.postMessage(current)}catch(e){}}function move(n){current=Math.max(1,Math.min(SLIDES.length,current+n));sync();render()}function render(){let s=SLIDES[current-1],d=DEMOS.find(x=>x.id===s.demo);document.getElementById('preview').innerHTML=`<span class="kicker">${String(s.n).padStart(2,'0')} · ${s.section}</span><h2>${s.title}</h2><p class="small">${s.body.replace(/<[^>]+>/g,' ')}</p>`;document.getElementById('title').textContent=s.title;document.getElementById('notes').textContent=s.note;document.getElementById('duration').textContent=s.time;document.getElementById('nav').innerHTML=SLIDES.map(x=>`<a class="nav-item ${x.n===current?'active':''}" href="#" onclick="current=${x.n};sync();render();return false">${String(x.n).padStart(2,'0')} ${x.title}</a>`).join('');document.getElementById('demo').innerHTML=d?`<details class="demo-card" open><summary>${d.id.toUpperCase()} · ${d.title}</summary><p class="small"><b>工具：</b>${d.tool}</p><button class="copy" onclick="copyText(DEMOS.find(x=>x.id==='${d.id}').prompt,this)">複製提示詞</button><pre class="prompt">${d.prompt}</pre><p class="small"><b>預期訊號：</b>${d.signals.join('／')}</p><button class="btn ghost" onclick="this.nextElementSibling.classList.toggle('hidden')">顯示備援結果</button><div class="notice hidden">${d.backup}</div></details>`:''}
let phases=[45,15,45,15],pi=0,remain=phases[0]*60,running=false,interval;function tick(){if(!running)return;remain--;if(remain<=0){running=false;clearInterval(interval)}showTimer()}function showTimer(){let m=Math.floor(remain/60),s=remain%60;document.getElementById('count').textContent=`${m}:${String(s).padStart(2,'0')}`;document.getElementById('phase').textContent=['第一堂 · 45 分鐘','中場休息 · 15 分鐘','第二堂 · 45 分鐘','問答 · 15 分鐘'][pi];let late=remain<0;document.getElementById('pace').textContent=late?'落後，請刪減互動或切備援結果':'依現場節奏調整；Live Demo 太慢就切備援結果'}function toggleTimer(){running=!running;if(running)interval=setInterval(tick,1000);else clearInterval(interval)}function resetTimer(){running=false;clearInterval(interval);remain=phases[pi]*60;showTimer()}function nextPhase(){pi=Math.min(3,pi+1);resetTimer()}setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),1000);render();showTimer();
</script></body></html>
