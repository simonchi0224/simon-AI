<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 教練工作術｜投影片</title><link rel="stylesheet" href="site.css?v=20260902-demo-flow-v2"><body class="slide-shell"><div id="slide"></div><div class="slide-nav no-print"><button onclick="go(-1)">←</button><button onclick="toggleBlack()">B 黑幕</button><button onclick="toggleOverview()">O 總覽</button><button onclick="go(1)">→</button></div><div id="overview" class="overview"><button class="btn ghost" onclick="toggleOverview()">關閉總覽</button><div id="thumbs" class="thumbs"></div></div><script src="course-data.js?v=20260902-demo-flow-v2"></script><script src="site.js?v=20260902-demo-flow-v2"></script><script>
const liveCss=document.createElement('link');liveCss.rel='stylesheet';liveCss.href='live-slide.css?v=20260902-demo-flow-v2';document.head.append(liveCss);let current=paramSlide(),black=false,showNumber=true,showBackup=false,breakRemain=900,breakInterval;const root=document.getElementById('slide');
function render(){const s=SLIDES[current-1],d=DEMOS.find(x=>x.id===s.demo);const demo=d?`<div class="demo-state"><b>${showBackup?'備援結果':'現場操作'} · ${d.id.toUpperCase()}</b><button class="btn ghost" onclick="toggleBackup()">${showBackup?'回到現場操作':'顯示備援結果'}</button>${showBackup?`<p>${d.backup}</p>`:''}</div>`:'';const pause=s.break?`<div class="break-clock">休息倒數 <strong id="break-count">15:00</strong><small>｜11:45 回來</small></div>`:'';root.innerHTML=`<section class="slide ${s.type} ${black?'black':''}"><div class="badge">${s.section.toUpperCase()}</div><span class="kicker">${String(s.n).padStart(2,'0')} · ${s.time}</span><h2>${s.title}</h2><div class="body">${s.body}</div>${demo}${pause}${showNumber?`<span class="number">${s.n} / ${SLIDES.length}</span>`:''}</section>`;if(s.break)startBreak();else stopBreak();history.replaceState(null,'',`?slide=${current}`);localStorage.setItem('nstc.slide',current);try{new BroadcastChannel('nstc-slide').postMessage(current)}catch(e){}}
function go(n){current=Math.max(1,Math.min(SLIDES.length,current+n));showBackup=false;render()}function toggleBlack(){black=!black;render()}function toggleOverview(){document.getElementById('overview').classList.toggle('open')}function fullscreen(){document.documentElement.requestFullscreen?.()}function toggleBackup(){showBackup=!showBackup;render()}function stopBreak(){clearInterval(breakInterval);breakInterval=null}function startBreak(){if(breakInterval)return;const update=()=>{const el=document.getElementById('break-count');if(el)el.textContent=`${String(Math.floor(breakRemain/60)).padStart(2,'0')}:${String(breakRemain%60).padStart(2,'0')}`};update();breakInterval=setInterval(()=>{if(breakRemain>0)breakRemain--;update()},1000)}
document.getElementById('thumbs').innerHTML=SLIDES.map(s=>`<div class="thumb" onclick="current=${s.n};render();toggleOverview()"><b>${String(s.n).padStart(2,'0')} · ${s.section}</b>${s.title}</div>`).join('');
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}if(e.key==='Home'){current=1;showBackup=false;render()}if(e.key==='End'){current=SLIDES.length;showBackup=false;render()}if(e.key.toLowerCase()==='b')toggleBlack();if(e.key.toLowerCase()==='o')toggleOverview();if(e.key.toLowerCase()==='n'){showNumber=!showNumber;render()}if(e.key.toLowerCase()==='f')fullscreen()});let x;addEventListener('touchstart',e=>x=e.touches[0].clientX);addEventListener('touchend',e=>{if(!x)return;let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>50)go(d<0?1:-1);x=null});try{new BroadcastChannel('nstc-slide').onmessage=e=>{if(Number(e.data)!==current){current=Number(e.data);showBackup=false;render()}}}catch(e){}render();
</script></body></html>
