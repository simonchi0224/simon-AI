<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 教練工作術｜列印版</title><link rel="stylesheet" href="site.css"><body class="print"><main id="print"></main><script src="course-data.js"></script><script>const notes=new URLSearchParams(location.search).get('notes')==='1';document.getElementById('print').innerHTML=SLIDES.map(s=>`<section class="print-slide"><span class="kicker">${String(s.n).padStart(2,'0')} · ${s.section} · ${s.time}</span><h1>${s.title}</h1><div style="font-size:1.8rem;line-height:1.6">${s.body}</div>${notes?`<hr><h3>講師備註</h3><p class="note">${s.note}</p>`:''}</section>`).join('')</script></body></html>
