<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#10191f"><title>匯聯實業｜AI 工作坊投影片</title><link rel="stylesheet" href="site.css?v=20261006-4"></head>
<body class="slide-body"><div class="slide-progress"><span id="progress"></span></div><main id="slide" class="slide-root" aria-live="polite"></main><div class="slide-count" id="count"></div><nav class="slide-controls" aria-label="投影片控制"><button type="button" onclick="go(-1)" aria-label="上一頁">←</button><button type="button" onclick="toggleOverview()" aria-label="投影片總覽">▦</button><button type="button" onclick="go(1)" aria-label="下一頁">→</button></nav><section class="slide-overview" id="overview"><div class="overview-head"><div><small>HUILIAN AI WORKSHOP</small><h2>投影片總覽</h2></div><button onclick="toggleOverview()">關閉 ×</button></div><div class="overview-grid" id="overview-grid"></div></section><script src="course-data.js?v=20261006-4"></script><script>
const root=document.getElementById('slide'), channelName=COURSE.channel;let savedSlide=1;try{savedSlide=Number(localStorage.getItem('huilian.slide'))||1}catch(e){}let current=Math.max(1,Math.min(COURSE.slides.length,Number(new URLSearchParams(location.search).get('slide'))||savedSlide)),black=false,channel;
try{channel=new BroadcastChannel(channelName);channel.onmessage=e=>{if(e.data&&Number(e.data.slide)){current=Number(e.data.slide);render(false)}}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lines(s){return esc(s).replace(/\n/g,'<br>')}
function content(s){
 if(s.type==='cover'||s.type==='end'){const titleHtml=esc(s.title).split('\n').map((line,i)=>i===1?`<span>${line}</span>`:line).join('<br>');return `<div class="slide-cover-inner"><p class="slide-kicker">${esc(s.section)}</p><h1>${titleHtml}</h1><p class="slide-subtitle">${esc(s.subtitle)}</p><div class="slide-badges">${s.chips?s.chips.map(x=>`<span>${esc(x)}</span>`).join(''):''}</div></div>`}
 if(s.type==='profile')return `<p class="slide-kicker">${esc(s.section)}</p><h2>${esc(s.title)}</h2><div class="profile-layout"><img class="profile-photo" src="assets/${esc(s.image)}?v=20261006-4" alt="季祥 Simon 講師照片"><div class="profile-details"><h3>${esc(s.subtitle)}</h3><p>${esc(s.bio)}</p><ul>${s.facts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><a class="profile-qr" href="${esc(s.profileUrl)}" target="_blank" rel="noopener"><img src="assets/${esc(s.qr)}?v=20261006-4" alt="講師介紹頁 QR code"><b>掃描查看完整介紹</b><small>${esc(s.profileUrl)}</small></a></div>`;
 if(s.type==='resources')return `<p class="slide-kicker">${esc(s.section)}</p><h2>${esc(s.title)}</h2><p class="lead resource-lead">${esc(s.subtitle)}</p><div class="resource-qr-grid">${s.links.map(x=>`<article class="resource-qr-card ${x[2]?'':'is-pending'}"><h3>${esc(x[0])}</h3>${x[3]?`<img src="assets/${esc(x[3])}?v=20261006-4" alt="${esc(x[0])} QR code">`:`<div class="qr-placeholder">問卷連結確認後<br>補上 QR code</div>`}<p>${esc(x[1])}</p>${x[2]?`<a href="${esc(x[2])}" target="_blank" rel="noopener">開啟連結 ↗</a>`:`<small>網址待補</small>`}</article>`).join('')}</div>`;
 if(s.type==='section')return `<div class="section-title"><p class="slide-kicker">${esc(s.section)}</p><h1>${lines(s.title)}</h1><p class="slide-subtitle">${esc(s.subtitle||'')}</p></div>`;
 let html=`<p class="slide-kicker">${esc(s.section)}</p><h2>${lines(s.title)}</h2>`;
 if(s.lead)html+=`<p class="lead">${esc(s.lead)}</p>`;
 if(s.type==='split')html+=`<ul class="bullet-list">${s.bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 if(s.type==='questions')html+=`<div class="question-list">${s.questions.map((x,i)=>`<div class="question-card"><span>QUESTION 0${i+1}</span>${esc(x)}</div>`).join('')}</div>`;
 if(s.type==='flow')html+=`<div class="flow-steps">${s.steps.map(x=>`<div class="flow-step"><b>${esc(x[0])}</b><strong>${esc(x[1])}</strong><small>${esc(x[2])}</small></div>`).join('')}</div>`;
 if(s.type==='agenda')html+=`<div class="agenda-table">${COURSE.agenda.map(x=>`<div class="agenda-item"><time>${esc(x.time)}</time><b>${esc(x.title)}</b><small>${esc(x.tag)}</small></div>`).join('')}</div>`;
 if(s.type==='guard')html+=`<ul class="bullet-list">${s.bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 if(s.type==='formula')html+=`<div class="formula-grid">${s.items.map((x,i)=>`<div class="formula-card"><b>0${i+1} · ${esc(x[0])}</b><small>${esc(x[1])}</small></div>`).join('')}</div>`;
 if(s.type==='compare')html+=`<div class="compare-grid"><article class="compare-card"><b>${esc(s.leftTitle)}</b><p>${esc(s.left)}</p></article><article class="compare-card is-accent"><b>${esc(s.rightTitle)}</b><p>${esc(s.right)}</p></article></div>${s.footer?`<p class="slide-foot">${esc(s.footer)}</p>`:''}`;
 if(s.type==='practice')html+=`<div class="practice-box"><div class="practice-task"><span>YOUR TASK</span><p>${esc(s.task)}</p></div><div class="practice-checks">${s.checklist.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`;
 if(s.type==='prompt')html+=`<div class="prompt-box"><pre>${esc(s.prompt)}</pre></div>`;
 if(s.type==='walkthrough')html+=`<div class="walkthrough-layout"><div class="walkthrough-main"><div class="walkthrough-steps">${s.steps.map((x,i)=>`<article class="walkthrough-step"><b>0${i+1}</b><div><strong>${esc(x[0])}</strong><p>${esc(x[1])}</p></div></article>`).join('')}</div><div class="walkthrough-prompt"><small>示範指令</small><p>${esc(s.prompt)}</p></div><p class="slide-foot">${esc(s.foot||'')}</p></div><figure class="walkthrough-visual"><img src="assets/${esc(s.image)}?v=20261006-4" alt="${esc(s.imageAlt||'課堂情境示意')}" loading="eager"><figcaption>課堂情境示意｜AI 生成圖片</figcaption></figure></div>`;
 if(s.type==='steps'||s.type==='demo')html+=`<ol class="step-list">${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${s.foot?`<p class="slide-foot">${esc(s.foot)}</p>`:''}`;
 if(s.type==='cards')html+=`<div class="cards-grid">${s.cards.map(x=>`<article class="info-card"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></article>`).join('')}</div>${s.foot?`<p class="slide-foot">${esc(s.foot)}</p>`:''}`;
 return html
}
function render(sync=true){const s=COURSE.slides[current-1];root.innerHTML=`<section class="slide ${s.type==='cover'?'cover':''} ${s.type==='end'?'end':''} ${black?'is-black':''}"><span class="slide-section-tag">${String(current).padStart(2,'0')} / ${String(COURSE.slides.length).padStart(2,'0')}</span>${content(s)}</section>`;document.getElementById('count').textContent=`${current} / ${COURSE.slides.length}`;document.getElementById('progress').style.width=`${current/COURSE.slides.length*100}%`;document.title=`${current}. ${s.title.replace(/\n/g,' ')}｜匯聯 AI 工作坊`;history.replaceState(null,'',`?slide=${current}`);try{localStorage.setItem('huilian.slide',current)}catch(e){}if(sync&&channel)channel.postMessage({slide:current})}
function go(step){current=Math.max(1,Math.min(COURSE.slides.length,current+step));render()}
function setSlide(n){current=Math.max(1,Math.min(COURSE.slides.length,n));toggleOverview(false);render()}
function toggleOverview(force){const el=document.getElementById('overview');el.classList.toggle('open',typeof force==='boolean'?force:!el.classList.contains('open'))}
document.getElementById('overview-grid').innerHTML=COURSE.slides.map((s,i)=>`<button class="overview-item" onclick="setSlide(${i+1})"><small>${String(i+1).padStart(2,'0')} · ${esc(s.section)}</small><b>${esc(s.title.replace(/\n/g,' '))}</b></button>`).join('');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('overview').classList.contains('open')){toggleOverview(false);return}if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}else if(e.key==='Home'){current=1;render()}else if(e.key==='End'){current=COURSE.slides.length;render()}else if(e.key.toLowerCase()==='o'){toggleOverview()}else if(e.key.toLowerCase()==='b'){black=!black;document.body.classList.toggle('screen-black',black)}else if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}});
let touchX=0;document.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>65)go(d<0?1:-1)},{passive:true});render(false);
</script></body></html>
