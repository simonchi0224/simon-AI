<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>匯聯 AI 工作坊｜講師控制台</title><link rel="stylesheet" href="site.css?v=20261006-2"></head><body class="presenter-body"><header class="presenter-header"><div><h1>匯聯實業｜AI 工作坊講師控制台</h1><small>按投影片清單切頁，開啟投影片視窗後會同步顯示。</small></div><a href="../../../w/20261006-slides.html" target="_blank" rel="noopener">另開投影片 ↗</a></header><main class="presenter"><aside class="panel"><h2>投影片導覽</h2><div id="slide-nav" class="slide-nav"></div></aside><section class="preview-wrap"><div class="panel"><h2 id="section-name">CURRENT SLIDE</h2><div class="preview" id="preview"></div><div class="presenter-actions"><button onclick="move(-1)">← 上一頁</button><button onclick="move(1)">下一頁 →</button><button onclick="openSlides()">開啟／切換投影片 ↗</button></div></div><div class="panel timer-box"><span id="phase-label">課堂計時</span><strong id="timer">10:00</strong><em id="timer-state">尚未開始</em><div class="timer-controls"><button onclick="setMinutes(10)">10 分</button><button onclick="setMinutes(15)">15 分</button><button onclick="setMinutes(25)">25 分</button><button onclick="setMinutes(30)">30 分</button></div><div class="timer-controls"><button onclick="toggleTimer()">開始／暫停</button><button onclick="resetTimer()">重設</button></div></div><div class="panel"><h2>四小時課程節點</h2><div id="agenda-nav" class="slide-nav"></div></div></section><aside class="panel notes-panel"><h2>講師備註</h2><div id="notes" class="notes-text"></div><div class="presenter-alert" style="margin-top:16px">實際操作遇到登入、權限或功能差異時，改用課堂提供素材示範，保留學員練習時間。不要在課堂上傳未授權的公司或客戶資料。</div></aside></main><script src="course-data.js?v=20261006-2"></script><script>
let savedSlide=1;try{savedSlide=Number(localStorage.getItem('huilian.slide'))||1}catch(e){}let current=Math.max(1,Math.min(COURSE.slides.length,savedSlide)),seconds=600,timerId=null,channel;const $=s=>document.querySelector(s);try{channel=new BroadcastChannel(COURSE.channel);channel.onmessage=e=>{if(e.data&&Number(e.data.slide)){current=Number(e.data.slide);render()}}}catch(e){}
function send(){try{localStorage.setItem('huilian.slide',current)}catch(e){}if(channel)channel.postMessage({slide:current})}
function render(){const s=COURSE.slides[current-1];$('#section-name').textContent=`${String(current).padStart(2,'0')} / ${COURSE.slides.length} · ${s.section}`;$('#preview').innerHTML=`<small>${s.section}</small><h2>${s.title.replace(/\n/g,'<br>')}</h2><p>${(s.subtitle||s.lead||s.task||s.bullets?.slice(0,2).join('\n')||s.questions?.join('\n')||s.prompt||'').replace(/</g,'&lt;').replace(/>/g,'&gt;').slice(0,550)}</p>`;$('#notes').textContent=s.notes||'本頁無額外講師備註。';document.querySelectorAll('#slide-nav button').forEach((b,i)=>b.classList.toggle('active',i===current-1));send()}
function move(n){current=Math.max(1,Math.min(COURSE.slides.length,current+n));render()}
function setSlide(n){current=n;render()}
function openSlides(){window.open('../../../w/20261006-slides.html?slide='+current,'huilian-slides')}
function setMinutes(n){seconds=n*60;$('#phase-label').textContent=`練習／說明計時 · ${n} 分鐘`;updateTimer();if(timerId){clearInterval(timerId);timerId=null;$('#timer-state').textContent='已重設，尚未開始'}}
function updateTimer(){$('#timer').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function toggleTimer(){if(timerId){clearInterval(timerId);timerId=null;$('#timer-state').textContent='已暫停'}else{$('#timer-state').textContent='計時中';timerId=setInterval(()=>{if(seconds>0){seconds--;updateTimer()}else{clearInterval(timerId);timerId=null;$('#timer-state').textContent='時間到'}} ,1000)}}
function resetTimer(){if(timerId)clearInterval(timerId);timerId=null;seconds=600;$('#phase-label').textContent='課堂計時';$('#timer-state').textContent='尚未開始';updateTimer()}
$('#slide-nav').innerHTML=COURSE.slides.map((s,i)=>`<button onclick="setSlide(${i+1})"><span>${String(i+1).padStart(2,'0')}</span>${s.title.replace(/\n/g,' ')}</button>`).join('');$('#agenda-nav').innerHTML=COURSE.agenda.map((x,i)=>`<button onclick="setMinutes(${parseInt(x.tag,10)||10});$('#phase-label').textContent='${x.time} · ${x.title}'"><span>${x.time}</span>${x.title}<br><small>${x.tag}</small></button>`).join('');document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();updateTimer();
</script></body></html>
