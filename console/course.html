<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課程詳情 | 講師控制台</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="data/styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="brand">講師<span>控制台</span></a>
    <div class="topnav">
      <a href="index.html">首頁</a>
      <a href="courses.html" class="active">我的課程</a>
      <a href="prompts.html">提示語庫</a>
    </div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="theme-toggle" title="切換深淺色">🌙</button>
  </div>
</div>

<div class="wrap" id="content"></div>

<footer class="foot">講師控制台 · 僅供 Simon 自己使用</footer>

<script src="data/data.js"></script>
<script src="data/app.js"></script>
<script>
initTheme();

const params = new URLSearchParams(location.search);
const course = findCourse(params.get("id")) || COURSES[0];
setLastCourse(course.id);

const iconFor = { site: "🖥️", doc: "📄", folder: "📁", sheet: "📊", slides: "📽️", tool: "🔧" };

document.getElementById("content").innerHTML = `
  <span class="page-eyebrow">${course.tags.map(escapeHtml).join(" · ")}</span>
  <h1 class="page-title">${escapeHtml(course.title)}</h1>
  <p class="page-sub">${escapeHtml(course.summary)}</p>

  <div class="quick-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:24px">
    <div class="quick-card" style="cursor:default"><div class="quick-title">對象</div><div class="quick-desc">${escapeHtml(course.audience)}</div></div>
    <div class="quick-card" style="cursor:default"><div class="quick-title">時間</div><div class="quick-desc">${escapeHtml(course.date)}<br>${escapeHtml(course.time)}</div></div>
    <div class="quick-card" style="cursor:default"><div class="quick-title">地點</div><div class="quick-desc">${escapeHtml(course.location)}</div></div>
    <div class="quick-card" style="cursor:default"><div class="quick-title">版本</div><div class="quick-desc">${escapeHtml(course.version)} · 更新於 ${escapeHtml(course.updatedAt)}</div></div>
  </div>

  <a class="btn" href="teach.html?course=${course.id}">進入講師模式 →</a>

  <span class="sec-label">資源總覽</span>
  <div class="res-list">
    ${course.resources.map(r => `
      <div class="res-row">
        <span class="res-type">${escapeHtml(r.type)}</span>
        <div class="res-info">
          <div class="res-title">${escapeHtml(r.title)} ${lockBadge(r.revealSession, 4)}</div>
          <div class="res-desc">${escapeHtml(r.description)}</div>
        </div>
        <div class="res-actions"><a class="btn sm ghost" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">開啟 ↗</a></div>
      </div>`).join("")}
  </div>

  <span class="sec-label">單元導覽</span>
  ${course.sessions.map(s => `
    <div class="unit-row">
      <div class="unit-head">
        <span class="unit-title">${escapeHtml(s.title)}</span>
        <span class="unit-time">${s.durationMinutes} 分鐘</span>
      </div>
      <div class="unit-obj">${escapeHtml(s.objective)}</div>
      <div class="unit-outputs">${s.outputs.map(o => `<span class="out-pill">${escapeHtml(o)}</span>`).join("")}</div>
      <div style="margin-top:12px"><a class="btn sm ghost" href="teach.html?course=${course.id}&session=${s.id}">進入本堂講師模式 →</a></div>
    </div>`).join("")}
`;
</script>
</body>
</html>
